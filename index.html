<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myroot</title>
  <link rel="stylesheet" href="Assets/modal.css" />
  <style>
    @font-face {
      font-family: 'Noto Sans CJK SC';
      src: url('Assets/NotoSansCJKsc-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      text-decoration: none;
      transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s, opacity 0.25s, transform 0.25s, filter 0.25s, color 0.25s;
    }
    body {
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      --color: #E1E1E1;
      background-color: #F3F3F3;
      background-image: linear-gradient(0deg, transparent 24%, var(--color) 25%, var(--color) 26%, transparent 27%,transparent 74%, var(--color) 75%, var(--color) 76%, transparent 77%,transparent),
      linear-gradient(90deg, transparent 24%, var(--color) 25%, var(--color) 26%, transparent 27%,transparent 74%, var(--color) 75%, var(--color) 76%, transparent 77%,transparent);
      background-size: 55px 55px;
      font-family: 'Noto Sans CJK SC', '微软雅黑', 'PingFang SC', sans-serif;
    }
    .warning-icon svg {
      width: 22px;
      height: 22px;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 90%;
      max-width: 560px;
    }
    .sep-line {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0.4rem 0;
    }
    .local-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    #local-file-name {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      word-break: break-all;
    }
    #local-sha256 {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      word-break: break-all;
      font-family: monospace;
    }
    .file-input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .file-input-wrap input[type="file"] {
      display: none;
    }
    .panel {
      width: 100%;
      background: rgba(42, 42, 42, 0.92);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .panel-title {
      color: #f0f0f0;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 0.8rem;
      letter-spacing: 0.3px;
    }
    #device-selector {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(30, 30, 30, 0.9);
      color: #f0f0f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      margin-bottom: 0.8rem;
    }
    #device-selector option {
      background: #1e1e1e;
      color: #f0f0f0;
    }
    #device-selector:focus {
      border-color: rgba(80, 160, 255, 0.5);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-primary {
      background: rgba(60, 120, 220, 0.85);
      color: #fff;
    }
    .btn-primary:hover {
      background: rgba(60, 120, 220, 1);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: rgba(62, 62, 62, 0.85);
      color: #f5f5f5;
    }
    .btn-secondary:hover {
      background: rgba(80, 80, 80, 0.9);
      transform: translateY(-1px);
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }
    .badge-ok { background: rgba(40, 180, 70, 0.25); color: #5cd87a; }
    .badge-warn { background: rgba(220, 160, 40, 0.25); color: #f0c040; }
    .badge-fail { background: rgba(200, 60, 60, 0.25); color: #ff6b6b; }
    #status-bar {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }
    @media (max-width: 480px) {
      body { background-size: 25px 25px; padding: 0.75rem; }
      .panel { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 设备选择面板 -->
    <div class="panel">
      <div class="panel-title">
        设备选择
        <span id="manifest-status" class="badge badge-warn">加载中</span>
      </div>
      <select id="device-selector" disabled>
        <option value="">— 正在加载设备列表 —</option>
      </select>
      <div class="btn-row">
        <button id="btn-run" class="btn btn-primary" disabled>获取 Root</button>
      </div>
      <div id="status-bar" style="margin-top:8px;">初始化中...</div>

      <div class="sep-line"></div>

      <div class="local-area">
        <div class="file-input-wrap">
          <button id="btn-local" class="btn btn-secondary" style="flex:none;padding:8px 14px;font-size:13px;">📁 本地上传 .so</button>
          <span id="local-file-name" style="flex:1;">未选择文件</span>
        </div>
        <div id="local-sha256"></div>
        <button id="btn-run-local" class="btn btn-primary" disabled>使用本地 .so 执行</button>
      </div>
    </div>

    <!-- 终端面板 -->
    <div class="panel" style="padding:0;overflow:hidden;">
      <div id="out" style="white-space:pre-wrap;word-break:break-all;font-family:monospace;padding:16px 16px 80px;color:#e0e0e0;font-weight:500;font-size:13px;line-height:1.5;min-height:200px;max-height:400px;overflow-y:auto;"></div>
      <input id="cmd" style="width:100%;box-sizing:border-box;padding:10px 16px;border:none;border-top:1px solid rgba(255,255,255,0.08);background:rgba(30,30,30,0.95);color:#f0f0f0;font-size:13px;font-family:monospace;outline:none;" autofocus placeholder="Shell 就绪后在此输入命令 (exit 退出)">
    </div>
  </div>

  <script src="Assets/modal.js"></script>
  <script src="ansi.js"></script>
  <script src="exploit.js"></script>
  <script>
    // ====== manifest 加载 ======
    let manifest = null;
    const sel = document.getElementById('device-selector');
    const btnRun = document.getElementById('btn-run');
    const statusBar = document.getElementById('status-bar');
    const manifestStatus = document.getElementById('manifest-status');

    async function loadManifest() {
      try {
        const resp = await fetch('manifest.json?t=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        manifest = await resp.json();
        if (!manifest.devices || manifest.devices.length === 0) throw new Error('设备列表为空');
        
        sel.innerHTML = '<option value="">— 请选择设备 —</option>';
        manifest.devices.forEach(function(d, i) {
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = d.kernel ? d.name + ' · ' + d.kernel : d.name;
          sel.appendChild(opt);
        });
        sel.disabled = false;
        btnRun.disabled = true;
        manifestStatus.textContent = '已加载 ' + manifest.devices.length + ' 个设备';
        manifestStatus.className = 'badge badge-ok';
        statusBar.textContent = '请选择你的设备';
      } catch (e) {
        manifestStatus.textContent = '加载失败';
        manifestStatus.className = 'badge badge-fail';
        statusBar.textContent = 'manifest.json 加载失败: ' + e.message;
        sel.innerHTML = '<option value="">— 加载失败 —</option>';
      }
    }

    // 设备切换
    sel.addEventListener('change', function() {
      const idx = parseInt(this.value);
      if (isNaN(idx) || !manifest || !manifest.devices[idx]) {
        btnRun.disabled = true;
        statusBar.textContent = '请选择设备';
        return;
      }
      btnRun.disabled = false;
      statusBar.textContent = '已选择: ' + manifest.devices[idx].name + '，点击「获取 Root」执行';
    });

    // ====== 执行 Root ======
    btnRun.addEventListener('click', async function() {
      var idx = parseInt(sel.value);
      if (isNaN(idx) || !manifest || !manifest.devices[idx]) return;
      if (!window.uploadSoAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }
      var device = manifest.devices[idx];
      
      btnRun.disabled = true;
      btnRun.textContent = '下载 .so...';
      statusBar.textContent = '正在获取 ' + device.so + ' ...';
      
      try {
        var resp = await fetch(device.so, { cache: 'no-store' });
        if (!resp.ok) throw new Error('下载失败: HTTP ' + resp.status);
        var buf = await resp.arrayBuffer();
        
        btnRun.textContent = '执行中...';
        statusBar.textContent = '正在上传 .so 并提权...';
        
        // 利用 uploadSoAndRun 支持 File 对象的特性，
        // 把下载的 ArrayBuffer 转成 File 对象传进去
        var file = new File([buf], device.so.split('/').pop(), { type: 'application/octet-stream' });
        await window.uploadSoAndRun(file);
        
        btnRun.textContent = '执行完成';
        statusBar.textContent = device.name + ' 提权流程结束，查看终端输出';
      } catch (e) {
        btnRun.disabled = false;
        btnRun.textContent = '获取 Root';
        statusBar.textContent = '';
        if (typeof customAlert === 'function') customAlert('执行失败: ' + e.message);
      }
    });

    // ====== 本地 .so 上传 ======
    var localSoFile = null;
    var localSoHash = null;
    var localSoDisplayed = false;

    // 隐藏的文件输入
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.so,.so.*';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    document.getElementById('btn-local').addEventListener('click', function() {
      fileInput.click();
    });

    fileInput.addEventListener('change', async function(e) {
      var file = e.target.files[0];
      if (!file) return;

      document.getElementById('local-file-name').textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
      document.getElementById('local-sha256').textContent = 'SHA256: 计算中...';
      document.getElementById('btn-run-local').disabled = true;

      try {
        var buf = await file.arrayBuffer();
        var hash = await sha256(buf);
        localSoFile = file;
        localSoHash = hash;
        document.getElementById('local-sha256').textContent = 'SHA256: ' + hash;
        document.getElementById('btn-run-local').disabled = false;
        statusBar.textContent = '本地文件已就绪: ' + file.name;
      } catch (err) {
        document.getElementById('local-sha256').textContent = 'SHA256: ❌ 计算失败';
        if (typeof customAlert === 'function') {
          customAlert('文件读取失败: ' + err.message);
        }
      }
    });

    // ====== 使用本地 .so 执行 ======
    document.getElementById('btn-run-local').addEventListener('click', async function() {
      if (!localSoFile) {
        if (typeof customAlert === 'function') customAlert('请先选择本地的 .so 文件');
        return;
      }
      if (!window.uploadSoAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }

      var btn = document.getElementById('btn-run-local');
      btn.disabled = true;
      btn.textContent = '执行中...';
      statusBar.textContent = '正在使用本地 .so 提权...';

      // exploit.js 的 uploadSoAndRun 支持 File 对象，直接传
      await window.uploadSoAndRun(localSoFile);

      btn.textContent = '✅ 执行完成';
      statusBar.textContent = '本地 .so 提权流程结束，查看终端输出';
    });

    // ====== 启动 ======
    loadManifest();
  </script>
</body>
</html>
