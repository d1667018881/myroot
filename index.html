<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myroot</title>
  <link rel="stylesheet" href="Assets/modal.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      text-decoration: none;
    }
    body {
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #0a0a0f 0%, #14141f 50%, #0d0d18 100%);
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 92%;
      max-width: 540px;
    }
    .sep-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 80, 255, 0.2), transparent);
      margin: 0.3rem 0;
    }
    .local-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #local-file-name {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      word-break: break-all;
    }
    #local-sha256 {
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      word-break: break-all;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .file-input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .file-input-wrap input[type="file"] {
      display: none;
    }
    .panel {
      width: 100%;
      background: rgba(18, 18, 30, 0.85);
      border-radius: 20px;
      padding: 1.2rem 1.4rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(120, 80, 255, 0.12);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .panel-title {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 0.8rem;
      letter-spacing: 0.5px;
    }
    #device-selector {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.35);
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      margin-bottom: 0.8rem;
      transition: border-color 0.2s;
    }
    #device-selector option {
      background: #0f0f1a;
      color: #e0e0e0;
    }
    #device-selector:focus {
      border-color: rgba(120, 80, 255, 0.4);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(120, 80, 255, 0.85), rgba(80, 60, 200, 0.85));
      color: #fff;
      box-shadow: 0 2px 12px rgba(120, 80, 255, 0.2);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(120, 80, 255, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      margin-left: 6px;
    }
    .badge-ok { background: rgba(40, 180, 70, 0.15); color: #5cd87a; }
    .badge-warn { background: rgba(220, 160, 40, 0.15); color: #f0c040; }
    .badge-fail { background: rgba(200, 60, 60, 0.15); color: #ff6b6b; }
    #status-bar {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      text-align: center;
      margin-top: 8px;
    }
    #out {
      white-space:pre-wrap;
      word-break:break-all;
      font-family:'SF Mono','Fira Code','Cascadia Code',monospace;
      padding:20px 20px 80px;
      color:#d0d0e0;
      font-weight:400;
      font-size:13px;
      line-height:1.6;
      min-height:200px;
      max-height:400px;
      overflow-y:auto;
      background:rgba(0,0,0,0.25);
    }
    #cmd {
      width:100%;
      box-sizing:border-box;
      padding:12px 16px;
      border:none;
      border-top:1px solid rgba(120,80,255,0.1);
      background:rgba(0,0,0,0.4);
      color:#e0e0e0;
      font-size:13px;
      font-family:'SF Mono','Fira Code','Cascadia Code',monospace;
      outline:none;
    }
    #cmd::placeholder {
      color: rgba(255,255,255,0.2);
    }
    @media (max-width: 480px) {
      body { padding: 0.5rem; }
      .panel { padding: 1rem; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 设备选择面板 -->
    <div class="panel">
      <div class="panel-title">
        设备选择
        <span id="manifest-status" class="badge badge-warn">加载中</span>
      </div>
      <select id="device-selector" disabled>
        <option value="">— 正在加载设备列表 —</option>
      </select>
      <div class="btn-row">
        <button id="btn-run" class="btn btn-primary" disabled>获取 Root</button>
      </div>
      <div id="status-bar">初始化中...</div>

      <div class="sep-line"></div>

      <div class="local-area">
        <div class="file-input-wrap">
          <button id="btn-local" class="btn btn-secondary" style="flex:none;padding:8px 14px;font-size:13px;">📁 本地上传 .so</button>
          <span id="local-file-name" style="flex:1;">未选择文件</span>
        </div>
        <div id="local-sha256"></div>
        <button id="btn-run-local" class="btn btn-primary" disabled>使用本地 .so 执行</button>
      </div>
    </div>

    <!-- 终端面板 -->
    <div class="panel" style="padding:0;overflow:hidden;">
      <div id="out"></div>
      <input id="cmd" autofocus placeholder="Shell 就绪后在此输入命令 (exit 退出)">
    </div>
  </div>

  <script src="Assets/modal.js"></script>
  <script src="ansi.js"></script>
  <script src="exploit.js"></script>
  <script>
    // ====== manifest 加载 ======
    let manifest = null;
    const sel = document.getElementById('device-selector');
    const btnRun = document.getElementById('btn-run');
    const statusBar = document.getElementById('status-bar');
    const manifestStatus = document.getElementById('manifest-status');
    window.__deviceIndex = [];  // 扁平设备索引（optgroup 分组后仍按 index 取值）

    async function loadManifest() {
      try {
        const resp = await fetch('manifest.json?t=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        manifest = await resp.json();
        const groups = manifest.groups || [];
        window.__deviceIndex = [];
        groups.forEach(function(g) {
          (g.devices || []).forEach(function(d) { window.__deviceIndex.push(d); });
        });
        if (window.__deviceIndex.length === 0) throw new Error('设备列表为空');

        sel.innerHTML = '<option value="">— 请选择设备 —</option>';
        groups.forEach(function(g) {
          var og = document.createElement('optgroup');
          og.label = g.name + '（' + (g.devices || []).length + ' 个）';
          (g.devices || []).forEach(function(d) {
            var opt = document.createElement('option');
            opt.value = String(window.__deviceIndex.indexOf(d));
            // 简短来源名 + 机型 + 内核
            var shortSrc = (d.source || '').split('/')[0];
            opt.textContent = '[' + shortSrc + '] ' + d.name + ' · ' + (d.kernel || '');
            og.appendChild(opt);
          });
          sel.appendChild(og);
        });
        sel.disabled = false;
        btnRun.disabled = true;
        manifestStatus.textContent = '已加载 ' + window.__deviceIndex.length + ' 个设备';
        manifestStatus.className = 'badge badge-ok';
        statusBar.textContent = '请选择你的设备（GhostLock 组优先，走 KernelSU 管理）';
      } catch (e) {
        manifestStatus.textContent = '加载失败';
        manifestStatus.className = 'badge badge-fail';
        statusBar.textContent = 'manifest.json 加载失败: ' + e.message;
        sel.innerHTML = '<option value="">— 加载失败 —</option>';
      }
    }

    // 设备切换
    sel.addEventListener('change', function() {
      const idx = parseInt(this.value);
      const device = window.__deviceIndex[idx];
      if (isNaN(idx) || !device) {
        btnRun.disabled = true;
        statusBar.textContent = '请选择设备';
        return;
      }
      btnRun.disabled = false;
      statusBar.textContent = '已选择: ' + device.name + ' · 来源 ' + (device.source || '未知') + '（' + (device.sourceUrl || '') + '）';
    });

    // ====== 执行 Root ======
    btnRun.addEventListener('click', async function() {
      var idx = parseInt(sel.value);
      var device = window.__deviceIndex[idx];
      if (isNaN(idx) || !device) return;
      if (!window.uploadSoAndRun || !window.uploadBinAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }
      var isBin = device.type === 'bin';
      var isSpawn = !!device.spawn;
      
      btnRun.disabled = true;
      btnRun.textContent = '下载中...';
      statusBar.textContent = '正在获取 ' + device.so + ' ...';
      
      try {
        var resp = await fetch(device.so, { cache: 'no-store' });
        if (!resp.ok) throw new Error('下载失败: HTTP ' + resp.status);
        var buf = await resp.arrayBuffer();
        
        btnRun.textContent = '执行中...';
        statusBar.textContent = isSpawn ? '正在上传并通过 LD_PRELOAD 提权...' : (isBin ? '正在上传并运行 ghostlock...' : '正在上传 .so 并提权...');
        
        // 按设备类型分发：spawn = LD_PRELOAD+等待，bin = 独立执行，so = 标准 LD_PRELOAD 轮询
        var file = new File([buf], device.so.split('/').pop(), { type: 'application/octet-stream' });
        if (isSpawn) {
          await window.uploadSoSpawnAndRun(file, 120000);
        } else if (isBin) {
          await window.uploadBinAndRun(file);
        } else {
          await window.uploadSoAndRun(file);
        }
        
        btnRun.textContent = '执行完成';
        statusBar.textContent = device.name + ' 提权流程结束，查看终端输出';
      } catch (e) {
        btnRun.disabled = false;
        btnRun.textContent = '获取 Root';
        statusBar.textContent = '';
        if (typeof customAlert === 'function') customAlert('执行失败: ' + e.message);
      }
    });

    // ====== SHA256 计算（仅用于本地文件信息展示）======
    async function sha256(buffer) {
      var hash = await crypto.subtle.digest('SHA-256', buffer);
      var hex = '';
      var bytes = new Uint8Array(hash);
      for (var i = 0; i < bytes.length; i++) {
        hex += bytes[i].toString(16).padStart(2, '0');
      }
      return hex;
    }

    // ====== 本地 .so 上传 ======
    var localSoFile = null;

    // 隐藏的文件输入
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.so,.so.*';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    document.getElementById('btn-local').addEventListener('click', function() {
      fileInput.click();
    });

    fileInput.addEventListener('change', async function(e) {
      var file = e.target.files[0];
      if (!file) return;

      document.getElementById('local-file-name').textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
      document.getElementById('local-sha256').textContent = 'SHA256: 计算中...';
      document.getElementById('btn-run-local').disabled = true;

      try {
        var buf = await file.arrayBuffer();
        var hash = await sha256(buf);
        localSoFile = file;
        document.getElementById('local-sha256').textContent = 'SHA256: ' + hash;
        document.getElementById('btn-run-local').disabled = false;
        statusBar.textContent = '本地文件已就绪: ' + file.name;
      } catch (err) {
        document.getElementById('local-sha256').textContent = 'SHA256: ❌ 计算失败';
        if (typeof customAlert === 'function') {
          customAlert('文件读取失败: ' + err.message);
        }
      }
    });

    // ====== 使用本地 .so 执行 ======
    document.getElementById('btn-run-local').addEventListener('click', async function() {
      if (!localSoFile) {
        if (typeof customAlert === 'function') customAlert('请先选择本地的 .so 文件');
        return;
      }
      if (!window.uploadSoAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }

      var btn = document.getElementById('btn-run-local');
      btn.disabled = true;
      btn.textContent = '执行中...';
      statusBar.textContent = '正在使用本地 .so 提权...';

      // exploit.js 的 uploadSoAndRun 支持 File 对象，直接传
      await window.uploadSoAndRun(localSoFile);

      btn.textContent = '✅ 执行完成';
      statusBar.textContent = '本地 .so 提权流程结束，查看终端输出';
    });

    // ====== 启动 ======
    loadManifest();
  </script>
</body>
</html>
