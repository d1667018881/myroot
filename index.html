<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myroot</title>
  <link rel="stylesheet" href="Assets/modal.css" />
  <style>
    :root {
      /* ===== 浅色主题（默认） ===== */
      --bg-gradient: linear-gradient(145deg, #f2f2f8 0%, #ffffff 50%, #eef0f8 100%);
      --panel-bg: rgba(255,255,255,0.92);
      --panel-border: rgba(120, 80, 255, 0.16);
      --panel-shadow: 0 4px 24px rgba(120, 80, 255, 0.08);
      --text-primary: #1a1a2e;
      --text-title: #22223a;
      --text-secondary: rgba(30,30,60,0.6);
      --text-muted: rgba(30,30,60,0.45);
      --card-bg: rgba(255,255,255,0.75);
      --card-border: rgba(30,30,60,0.1);
      --card-hover-border: rgba(120,80,255,0.4);
      --card-selected-bg: rgba(120,80,255,0.09);
      --card-selected-border: rgba(120,80,255,0.6);
      --source-color: rgba(100,70,200,0.75);
      --group-title-color: rgba(30,30,60,0.55);
      --status-color: rgba(30,30,60,0.55);
      --terminal-bg: rgba(20,20,40,0.04);
      --terminal-text: #303048;
      --cmd-bg: rgba(20,20,40,0.04);
      --cmd-text: #1a1a2e;
      --cmd-placeholder: rgba(30,30,60,0.3);
      --btn-secondary-bg: rgba(30,30,60,0.06);
      --btn-secondary-text: rgba(30,30,60,0.75);
      --btn-secondary-border: rgba(30,30,60,0.12);
      --btn-secondary-hover-bg: rgba(30,30,60,0.1);
      --ksu-link-color: rgba(95,60,200,0.85);
      --ksu-link-border: rgba(95,60,200,0.3);
      --ksu-link-hover-bg: rgba(95,60,200,0.08);
      --help-color: rgba(95,60,200,0.85);
      --help-border: rgba(95,60,200,0.35);
      --help-hover-bg: rgba(95,60,200,0.1);
      --sep-line: linear-gradient(90deg, transparent, rgba(120,80,255,0.25), transparent);
      --scrollbar: rgba(120,80,255,0.35);
      /* 弹窗 */
      --modal-overlay-bg: rgba(20,20,40,0.4);
      --modal-card-bg: rgba(255,255,255,0.96);
      --modal-card-border: rgba(120,80,255,0.22);
      --modal-card-shadow: 0 16px 48px rgba(60,40,120,0.25);
      --modal-text: #202038;
      --modal-btn-bg: rgba(30,30,60,0.06);
      --modal-btn-border: rgba(30,30,60,0.14);
      --modal-btn-text: #202038;
      --modal-link-color: #4a6fe0;
      --picker-card-bg: rgba(255,255,255,0.97);
      --picker-header-border: rgba(120,80,255,0.14);
    }
    [data-theme="dark"] {
      --bg-gradient: linear-gradient(145deg, #0a0a0f 0%, #14141f 50%, #0d0d18 100%);
      --panel-bg: rgba(18, 18, 30, 0.85);
      --panel-border: rgba(120, 80, 255, 0.12);
      --panel-shadow: 0 4px 24px rgba(0,0,0,0.4);
      --text-primary: #f0f0f0;
      --text-title: #ffffff;
      --text-secondary: rgba(255,255,255,0.55);
      --text-muted: rgba(255,255,255,0.38);
      --card-bg: rgba(0,0,0,0.2);
      --card-border: rgba(255,255,255,0.07);
      --card-hover-border: rgba(120,80,255,0.3);
      --card-selected-bg: rgba(120,80,255,0.1);
      --card-selected-border: rgba(120,80,255,0.65);
      --source-color: rgba(140, 110, 255, 0.65);
      --group-title-color: rgba(255,255,255,0.55);
      --status-color: rgba(255,255,255,0.45);
      --terminal-bg: rgba(0,0,0,0.25);
      --terminal-text: #d0d0e0;
      --cmd-bg: rgba(0,0,0,0.4);
      --cmd-text: #e0e0e0;
      --cmd-placeholder: rgba(255,255,255,0.2);
      --btn-secondary-bg: rgba(255,255,255,0.06);
      --btn-secondary-text: rgba(255,255,255,0.7);
      --btn-secondary-border: rgba(255,255,255,0.08);
      --btn-secondary-hover-bg: rgba(255,255,255,0.1);
      --ksu-link-color: rgba(120, 150, 255, 0.8);
      --ksu-link-border: rgba(120, 150, 255, 0.25);
      --ksu-link-hover-bg: rgba(120, 150, 255, 0.1);
      --help-color: rgba(140, 170, 255, 0.85);
      --help-border: rgba(120, 150, 255, 0.3);
      --help-hover-bg: rgba(120, 150, 255, 0.12);
      --sep-line: linear-gradient(90deg, transparent, rgba(120, 80, 255, 0.2), transparent);
      --scrollbar: rgba(120,80,255,0.3);
      --modal-overlay-bg: rgba(4, 4, 12, 0.68);
      --modal-card-bg: rgba(18, 18, 30, 0.95);
      --modal-card-border: rgba(120, 80, 255, 0.28);
      --modal-card-shadow: 0 16px 48px rgba(0,0,0,0.6);
      --modal-text: #e8e8f0;
      --modal-btn-bg: rgba(255,255,255,0.08);
      --modal-btn-border: rgba(255,255,255,0.12);
      --modal-btn-text: #e8e8f0;
      --modal-link-color: #8ab0ff;
      --picker-card-bg: rgba(16, 16, 28, 0.96);
      --picker-header-border: rgba(120, 80, 255, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; }
    body {
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem 0;
      background: var(--bg-gradient);
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      transition: background 0.3s;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 92%;
      max-width: 540px;
    }
    .panel {
      width: 100%;
      background: var(--panel-bg);
      border-radius: 20px;
      padding: 1.2rem 1.3rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      transition: background 0.3s, border-color 0.3s;
    }
    .panel-title {
      color: var(--text-title);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .panel-title-left { display: flex; align-items: center; gap: 8px; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-ok { background: rgba(40, 180, 70, 0.15); color: #3aa65a; }
    .badge-warn { background: rgba(220, 160, 40, 0.18); color: #c89000; }
    .badge-fail { background: rgba(200, 60, 60, 0.15); color: #d04a4a; }
    [data-theme="dark"] .badge-ok { color: #5cd87a; }
    [data-theme="dark"] .badge-warn { color: #f0c040; }
    [data-theme="dark"] .badge-fail { color: #ff6b6b; }

    .theme-toggle {
      flex: none;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--btn-secondary-border);
      background: var(--btn-secondary-bg);
      cursor: pointer;
      font-size: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .theme-toggle:hover { background: var(--btn-secondary-hover-bg); }

    /* ===== 设备选择按钮 ===== */
    #btn-pick-device {
      width: 100%;
      margin-bottom: 10px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #btn-pick-device .pick-icon { flex: none; font-size: 15px; }
    #picked-device-label {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #picked-device-label.picked { color: var(--text-primary); }

    /* ===== 设备选择弹窗 ===== */
    .picker-card {
      width: min(94vw, 430px);
      max-height: 76vh;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      border: 1px solid var(--modal-card-border);
      background: var(--picker-card-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--modal-card-shadow);
      animation: modalSlideIn 0.25s ease;
      overflow: hidden;
    }
    .picker-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--picker-header-border);
      flex: none;
    }
    .picker-title { color: var(--text-primary); font-size: 14px; font-weight: 600; }
    .picker-close {
      background: var(--btn-secondary-bg); border: none; color: var(--text-secondary);
      width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 13px;
      transition: all 0.15s;
    }
    .picker-close:hover { background: var(--btn-secondary-hover-bg); color: var(--text-primary); }
    .picker-body {
      overflow-y: auto;
      padding: 6px 14px 14px;
      flex: 1;
    }
    .picker-body::-webkit-scrollbar { width: 4px; }
    .picker-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

    .group-title {
      color: var(--group-title-color);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 14px 0 8px;
      padding-left: 2px;
    }
    .group-title:first-child { margin-top: 4px; }
    .device-card {
      padding: 11px 13px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--card-bg);
    }
    .device-card:last-child { margin-bottom: 2px; }
    .device-card:hover { border-color: var(--card-hover-border); }
    .device-card.selected {
      border-color: var(--card-selected-border);
      background: var(--card-selected-bg);
      box-shadow: 0 0 0 1px var(--card-selected-border);
    }
    .device-name {
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
    }
    .device-meta { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
    .device-kernel {
      color: var(--text-muted);
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      word-break: break-all;
      line-height: 1.4;
    }
    .device-source { color: var(--source-color); font-size: 10px; }

    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(120, 80, 255, 0.85), rgba(80, 60, 200, 0.85));
      color: #fff;
      box-shadow: 0 2px 12px rgba(120, 80, 255, 0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(120, 80, 255, 0.35); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--btn-secondary-border);
    }
    .btn-secondary:hover { background: var(--btn-secondary-hover-bg); color: var(--text-primary); }

    #status-bar {
      font-size: 12px;
      color: var(--status-color);
      margin-top: 10px;
      line-height: 1.5;
      word-break: break-all;
    }
    .sep-line {
      width: 100%;
      height: 1px;
      background: var(--sep-line);
      margin: 0.8rem 0;
    }
    .local-area { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
    .file-input-wrap { display: flex; gap: 10px; align-items: center; }
    .file-input-wrap input[type="file"] { display: none; }
    #local-file-name { font-size: 12px; color: var(--status-color); word-break: break-all; }
    #local-sha256 { font-size: 11px; color: var(--text-muted); word-break: break-all; font-family: 'SF Mono', 'Fira Code', monospace; }
    .help-link {
      flex: none;
      width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--help-border);
      color: var(--help-color);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .help-link:hover { background: var(--help-hover-bg); color: var(--help-color); }

    .ksu-link { margin-top: 0.9rem; text-align: center; }
    .ksu-link a {
      display: inline-block;
      color: var(--ksu-link-color);
      font-size: 12px;
      padding: 6px 14px;
      border: 1px solid var(--ksu-link-border);
      border-radius: 20px;
      transition: all 0.2s;
    }
    .ksu-link a:hover { background: var(--ksu-link-hover-bg); }

    /* 终端 */
    #out {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 20px 20px 80px;
      color: var(--terminal-text);
      font-weight: 400;
      font-size: 13px;
      line-height: 1.6;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      background: var(--terminal-bg);
    }
    #cmd {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border: none;
      border-top: 1px solid var(--panel-border);
      background: var(--cmd-bg);
      color: var(--cmd-text);
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      outline: none;
    }
    #cmd::placeholder { color: var(--cmd-placeholder); }

    @media (max-width: 480px) {
      body { padding: 0.5rem 0; }
      .panel { padding: 1rem; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 设备选择面板 -->
    <div class="panel">
      <div class="panel-title">
        <div class="panel-title-left">
          <span>设备选择</span>
          <span id="manifest-status" class="badge badge-warn">加载中</span>
        </div>
        <button id="theme-toggle" class="theme-toggle" title="切换主题">🌙</button>
      </div>
      <button id="btn-pick-device" class="btn btn-secondary" disabled>
        <span class="pick-icon">📱</span>
        <span id="picked-device-label">— 点击选择设备 —</span>
      </button>
      <div class="btn-row">
        <button id="btn-run" class="btn btn-primary" disabled>获取 Root</button>
      </div>
      <div id="status-bar">请选择你的设备</div>

      <div class="sep-line"></div>

      <div class="local-area">
        <div class="file-input-wrap">
          <button id="btn-local" class="btn btn-secondary" style="flex:none;padding:8px 14px;font-size:13px;">📁 本地上传 .so</button>
          <a href="https://github.com/d1667018881/myroot#偏移提取教程" target="_blank" rel="noopener" class="help-link" title="如何编写/提取 .so 偏移量教程">❓</a>
          <span id="local-file-name" style="flex:1;">未选择文件</span>
        </div>
        <div id="local-sha256"></div>
        <button id="btn-run-local" class="btn btn-primary" disabled>使用本地 .so 执行</button>
      </div>

      <div class="ksu-link">
        <a href="https://github.com/tiann/KernelSU/releases" target="_blank" rel="noopener">📦 KernelSU 管理器 · 先安装（提权后自动激活）</a>
      </div>
    </div>

    <!-- 终端面板 -->
    <div class="panel" style="padding:0;overflow:hidden;">
      <div id="out"></div>
      <input id="cmd" autofocus placeholder="Shell 就绪后在此输入命令 (exit 退出)">
    </div>
  </div>

  <script src="Assets/modal.js?v=2"></script>
  <script src="ansi.js"></script>
  <script src="exploit.js?v=2"></script>
  <script>
    // ====== 主题切换 ======
    (function() {
      var saved = null;
      try { saved = localStorage.getItem('myroot-theme'); } catch (e) {}
      var theme = saved || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      updateToggleIcon(theme);
    })();
    function updateToggleIcon(theme) {
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
    }
    document.getElementById('theme-toggle').addEventListener('click', function() {
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('myroot-theme', next); } catch (e) {}
      updateToggleIcon(next);
    });

    // ====== manifest 加载 ======
    let manifest = null;
    const btnRun = document.getElementById('btn-run');
    const statusBar = document.getElementById('status-bar');
    const manifestStatus = document.getElementById('manifest-status');
    const pickedLabel = document.getElementById('picked-device-label');
    window.__deviceIndex = [];
    let selectedIdx = -1;

    function escapeHtml(s) {
      return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function selectDevice(idx) {
      selectedIdx = idx;
      var d = window.__deviceIndex[idx];
      if (!d) return;
      pickedLabel.textContent = d.name + (d.verified ? ' ✅实测' : '');
      pickedLabel.classList.add('picked');
      btnRun.disabled = false;
      statusBar.textContent = '已选择: ' + d.name + ' · 来源 ' + (d.source || '未知') + '（' + (d.sourceUrl || '') + '）';
    }

    // ====== 设备选择弹窗 ======
    function openDevicePicker() {
      if (!window.__deviceIndex.length) return;
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      var card = document.createElement('div');
      card.className = 'picker-card';
      var header = document.createElement('div');
      header.className = 'picker-header';
      var title = document.createElement('span');
      title.className = 'picker-title';
      title.textContent = '选择设备（' + window.__deviceIndex.length + ' 个）';
      var closeBtn = document.createElement('button');
      closeBtn.className = 'picker-close';
      closeBtn.textContent = '✕';
      header.appendChild(title);
      header.appendChild(closeBtn);
      var body = document.createElement('div');
      body.className = 'picker-body';
      manifest.groups.forEach(function(g) {
        var gt = document.createElement('div');
        gt.className = 'group-title';
        gt.textContent = g.name + ' · ' + (g.devices || []).length + ' 个';
        body.appendChild(gt);
        (g.devices || []).forEach(function(d) {
          var idx = window.__deviceIndex.indexOf(d);
          var dc = document.createElement('div');
          dc.className = 'device-card' + (idx === selectedIdx ? ' selected' : '');
          dc.innerHTML = '<div class="device-name">' + escapeHtml(d.name) + '</div>'
            + '<div class="device-meta">'
            + '<div class="device-kernel">' + escapeHtml(d.kernel || '内核未标注') + '</div>'
            + '<div class="device-source">来源: ' + escapeHtml(d.source || '未知') + '</div>'
            + '</div>';
          dc.onclick = function() {
            selectDevice(idx);
            closePicker(overlay);
          };
          body.appendChild(dc);
        });
      });
      function closePicker(ov) {
        ov.style.animation = 'modalFadeOut 0.2s ease';
        setTimeout(function() { ov.remove(); }, 200);
      }
      card.appendChild(header);
      card.appendChild(body);
      overlay.appendChild(card);
      document.body.appendChild(overlay);
      closeBtn.onclick = function() { closePicker(overlay); };
      overlay.onclick = function(e) { if (e.target === overlay) closePicker(overlay); };
    }

    async function loadManifest() {
      try {
        const resp = await fetch('manifest.json?t=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        manifest = await resp.json();
        const groups = manifest.groups || [];
        window.__deviceIndex = [];
        groups.forEach(function(g) {
          (g.devices || []).forEach(function(d) { window.__deviceIndex.push(d); });
        });
        if (window.__deviceIndex.length === 0) throw new Error('设备列表为空');
        document.getElementById('btn-pick-device').disabled = false;
        manifestStatus.textContent = '已加载 ' + window.__deviceIndex.length + ' 个设备';
        manifestStatus.className = 'badge badge-ok';
      } catch (e) {
        manifestStatus.textContent = '加载失败';
        manifestStatus.className = 'badge badge-fail';
        statusBar.textContent = 'manifest.json 加载失败: ' + e.message;
      }
    }

    document.getElementById('btn-pick-device').addEventListener('click', openDevicePicker);

    // ====== 执行 Root ======
    btnRun.addEventListener('click', async function() {
      var device = window.__deviceIndex[selectedIdx];
      if (!device) return;
      if (!window.uploadSoAndRun || !window.uploadBinAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }
      var isBin = device.type === 'bin';
      var isSpawn = !!device.spawn;

      btnRun.disabled = true;
      btnRun.textContent = '下载中...';
      statusBar.textContent = '正在获取 ' + device.so + ' ...';

      try {
        var resp = await fetch(device.so, { cache: 'no-store' });
        if (!resp.ok) throw new Error('下载失败: HTTP ' + resp.status);
        var buf = await resp.arrayBuffer();
        btnRun.textContent = '执行中...';
        statusBar.textContent = isSpawn ? '正在上传并通过 LD_PRELOAD 提权...' : (isBin ? '正在上传并运行 ghostlock...' : '正在上传 .so 并提权...');
        var file = new File([buf], device.so.split('/').pop(), { type: 'application/octet-stream' });
        if (isSpawn) {
          await window.uploadSoSpawnAndRun(file, 120000);
        } else if (isBin) {
          await window.uploadBinAndRun(file);
        } else {
          await window.uploadSoAndRun(file);
        }
        btnRun.textContent = '执行完成';
        statusBar.textContent = device.name + ' 提权流程结束，查看终端输出';
      } catch (e) {
        btnRun.disabled = false;
        btnRun.textContent = '获取 Root';
        statusBar.textContent = '';
        if (typeof customAlert === 'function') customAlert('执行失败: ' + e.message);
      }
    });

    // ====== SHA256 ======
    async function sha256(buffer) {
      var hash = await crypto.subtle.digest('SHA-256', buffer);
      var hex = '';
      var bytes = new Uint8Array(hash);
      for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
      return hex;
    }

    // ====== 本地 .so 上传 ======
    var localSoFile = null;
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.so,.so.*';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    document.getElementById('btn-local').addEventListener('click', function() { fileInput.click(); });

    fileInput.addEventListener('change', async function(e) {
      var file = e.target.files[0];
      if (!file) return;
      document.getElementById('local-file-name').textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
      document.getElementById('local-sha256').textContent = 'SHA256: 计算中...';
      document.getElementById('btn-run-local').disabled = true;
      try {
        var buf = await file.arrayBuffer();
        var hash = await sha256(buf);
        localSoFile = file;
        document.getElementById('local-sha256').textContent = 'SHA256: ' + hash;
        document.getElementById('btn-run-local').disabled = false;
        statusBar.textContent = '本地文件已就绪: ' + file.name;
      } catch (err) {
        document.getElementById('local-sha256').textContent = 'SHA256: ❌ 计算失败';
        if (typeof customAlert === 'function') customAlert('文件读取失败: ' + err.message);
      }
    });

    document.getElementById('btn-run-local').addEventListener('click', async function() {
      if (!localSoFile) {
        if (typeof customAlert === 'function') customAlert('请先选择本地的 .so 文件');
        return;
      }
      if (!window.uploadSoAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }
      var btn = document.getElementById('btn-run-local');
      btn.disabled = true;
      btn.textContent = '执行中...';
      statusBar.textContent = '正在使用本地 .so 提权...';
      await window.uploadSoAndRun(localSoFile);
      btn.textContent = '✅ 执行完成';
      statusBar.textContent = '本地 .so 提权流程结束，查看终端输出';
    });

    // ====== 启动 ======
    loadManifest();
  </script>
</body>
</html>
