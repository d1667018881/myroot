<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myroot</title>
  <link rel="stylesheet" href="Assets/modal.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; text-decoration: none; }
    body {
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem 0;
      background: linear-gradient(145deg, #0a0a0f 0%, #14141f 50%, #0d0d18 100%);
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 92%;
      max-width: 540px;
    }
    .panel {
      width: 100%;
      background: rgba(18, 18, 30, 0.85);
      border-radius: 20px;
      padding: 1.2rem 1.3rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(120, 80, 255, 0.12);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .panel-title {
      color: rgba(255,255,255,0.9);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-ok { background: rgba(40, 180, 70, 0.15); color: #5cd87a; }
    .badge-warn { background: rgba(220, 160, 40, 0.15); color: #f0c040; }
    .badge-fail { background: rgba(200, 60, 60, 0.15); color: #ff6b6b; }

    /* ===== 设备卡片列表 ===== */
    #device-list {
      width: 100%;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 0.8rem;
      padding-right: 4px;
    }
    #device-list::-webkit-scrollbar { width: 4px; }
    #device-list::-webkit-scrollbar-thumb { background: rgba(120,80,255,0.3); border-radius: 2px; }
    .group-title {
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 14px 0 8px;
      padding-left: 2px;
    }
    .group-title:first-child { margin-top: 0; }
    .device-card {
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      background: rgba(0,0,0,0.2);
    }
    .device-card:last-child { margin-bottom: 2px; }
    .device-card:hover { border-color: rgba(120,80,255,0.3); }
    .device-card.selected {
      border-color: rgba(120,80,255,0.65);
      background: rgba(120,80,255,0.1);
      box-shadow: 0 0 0 1px rgba(120,80,255,0.25);
    }
    .device-name {
      color: #f0f0f0;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
    }
    .device-name .verified {
      color: #5cd87a;
      font-size: 12px;
      margin-left: 2px;
    }
    .device-meta {
      margin-top: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .device-kernel {
      color: rgba(255,255,255,0.38);
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      word-break: break-all;
      line-height: 1.4;
    }
    .device-source {
      color: rgba(140, 110, 255, 0.65);
      font-size: 10px;
    }

    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1;
      padding: 11px 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(120, 80, 255, 0.85), rgba(80, 60, 200, 0.85));
      color: #fff;
      box-shadow: 0 2px 12px rgba(120, 80, 255, 0.2);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(120, 80, 255, 0.35); }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }

    #status-bar {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-top: 10px;
      line-height: 1.5;
      word-break: break-all;
    }
    .sep-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 80, 255, 0.2), transparent);
      margin: 0.8rem 0;
    }
    .local-area { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
    .file-input-wrap { display: flex; gap: 10px; align-items: center; }
    .file-input-wrap input[type="file"] { display: none; }
    #local-file-name { font-size: 12px; color: rgba(255,255,255,0.45); word-break: break-all; }
    #local-sha256 { font-size: 11px; color: rgba(255,255,255,0.25); word-break: break-all; font-family: 'SF Mono', 'Fira Code', monospace; }

    /* KernelSU 链接 */
    .ksu-link {
      margin-top: 0.9rem;
      text-align: center;
    }
    .ksu-link a {
      display: inline-block;
      color: rgba(120, 150, 255, 0.8);
      font-size: 12px;
      padding: 6px 14px;
      border: 1px solid rgba(120, 150, 255, 0.25);
      border-radius: 20px;
      transition: all 0.2s;
    }
    .ksu-link a:hover { background: rgba(120, 150, 255, 0.1); color: #a0c0ff; }

    /* 终端 */
    #out {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 20px 20px 80px;
      color: #d0d0e0;
      font-weight: 400;
      font-size: 13px;
      line-height: 1.6;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      background: rgba(0,0,0,0.25);
    }
    #cmd {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border: none;
      border-top: 1px solid rgba(120,80,255,0.1);
      background: rgba(0,0,0,0.4);
      color: #e0e0e0;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      outline: none;
    }
    #cmd::placeholder { color: rgba(255,255,255,0.2); }

    @media (max-width: 480px) {
      body { padding: 0.5rem 0; }
      .panel { padding: 1rem; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 设备选择面板 -->
    <div class="panel">
      <div class="panel-title">
        <span>设备选择</span>
        <span id="manifest-status" class="badge badge-warn">加载中</span>
      </div>
      <div id="device-list"></div>
      <div class="btn-row">
        <button id="btn-run" class="btn btn-primary" disabled>获取 Root</button>
      </div>
      <div id="status-bar">请选择你的设备</div>

      <div class="sep-line"></div>

      <div class="local-area">
        <div class="file-input-wrap">
          <button id="btn-local" class="btn btn-secondary" style="flex:none;padding:8px 14px;font-size:13px;">📁 本地上传 .so</button>
          <span id="local-file-name" style="flex:1;">未选择文件</span>
        </div>
        <div id="local-sha256"></div>
        <button id="btn-run-local" class="btn btn-primary" disabled>使用本地 .so 执行</button>
      </div>

      <div class="ksu-link">
        <a href="https://github.com/tiann/KernelSU/releases" target="_blank" rel="noopener">📦 KernelSU 管理器 · 官方下载</a>
      </div>
    </div>

    <!-- 终端面板 -->
    <div class="panel" style="padding:0;overflow:hidden;">
      <div id="out"></div>
      <input id="cmd" autofocus placeholder="Shell 就绪后在此输入命令 (exit 退出)">
    </div>
  </div>

  <script src="Assets/modal.js"></script>
  <script src="ansi.js"></script>
  <script src="exploit.js"></script>
  <script>
    // ====== manifest 加载 + 设备卡片渲染 ======
    let manifest = null;
    const list = document.getElementById('device-list');
    const btnRun = document.getElementById('btn-run');
    const statusBar = document.getElementById('status-bar');
    const manifestStatus = document.getElementById('manifest-status');
    window.__deviceIndex = [];
    let selectedIdx = -1;

    function selectDevice(idx) {
      selectedIdx = idx;
      // 高亮切换
      var cards = list.querySelectorAll('.device-card');
      cards.forEach(function(c, i) {
        if (i === idx) c.classList.add('selected');
        else c.classList.remove('selected');
      });
      var d = window.__deviceIndex[idx];
      if (!d) return;
      btnRun.disabled = false;
      statusBar.textContent = '已选择: ' + d.name + ' · 来源 ' + (d.source || '未知') + '（' + (d.sourceUrl || '') + '）';
      // 滚动到选中卡片
      var card = cards[idx];
      if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    async function loadManifest() {
      try {
        const resp = await fetch('manifest.json?t=' + Date.now(), { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        manifest = await resp.json();
        const groups = manifest.groups || [];
        window.__deviceIndex = [];
        groups.forEach(function(g) {
          (g.devices || []).forEach(function(d) { window.__deviceIndex.push(d); });
        });
        if (window.__deviceIndex.length === 0) throw new Error('设备列表为空');

        list.innerHTML = '';
        groups.forEach(function(g) {
          var title = document.createElement('div');
          title.className = 'group-title';
          title.textContent = g.name + ' · ' + (g.devices || []).length + ' 个';
          list.appendChild(title);

          (g.devices || []).forEach(function(d) {
            var idx = window.__deviceIndex.indexOf(d);
            var card = document.createElement('div');
            card.className = 'device-card';
            var nameHtml = '<div class="device-name">' + d.name.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
            var metaHtml = '<div class="device-meta">'
              + '<div class="device-kernel">' + (d.kernel || '内核未标注').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>'
              + '<div class="device-source">来源: ' + (d.source || '未知').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>'
              + '</div>';
            card.innerHTML = nameHtml + metaHtml;
            card.onclick = function() { selectDevice(idx); };
            list.appendChild(card);
          });
        });

        manifestStatus.textContent = '已加载 ' + window.__deviceIndex.length + ' 个设备';
        manifestStatus.className = 'badge badge-ok';
      } catch (e) {
        manifestStatus.textContent = '加载失败';
        manifestStatus.className = 'badge badge-fail';
        statusBar.textContent = 'manifest.json 加载失败: ' + e.message;
      }
    }

    // ====== 执行 Root ======
    btnRun.addEventListener('click', async function() {
      var device = window.__deviceIndex[selectedIdx];
      if (!device) return;
      if (!window.uploadSoAndRun || !window.uploadBinAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }
      var isBin = device.type === 'bin';
      var isSpawn = !!device.spawn;

      btnRun.disabled = true;
      btnRun.textContent = '下载中...';
      statusBar.textContent = '正在获取 ' + device.so + ' ...';

      try {
        var resp = await fetch(device.so, { cache: 'no-store' });
        if (!resp.ok) throw new Error('下载失败: HTTP ' + resp.status);
        var buf = await resp.arrayBuffer();

        btnRun.textContent = '执行中...';
        statusBar.textContent = isSpawn ? '正在上传并通过 LD_PRELOAD 提权...' : (isBin ? '正在上传并运行 ghostlock...' : '正在上传 .so 并提权...');

        var file = new File([buf], device.so.split('/').pop(), { type: 'application/octet-stream' });
        if (isSpawn) {
          await window.uploadSoSpawnAndRun(file, 120000);
        } else if (isBin) {
          await window.uploadBinAndRun(file);
        } else {
          await window.uploadSoAndRun(file);
        }

        btnRun.textContent = '执行完成';
        statusBar.textContent = device.name + ' 提权流程结束，查看终端输出';
      } catch (e) {
        btnRun.disabled = false;
        btnRun.textContent = '获取 Root';
        statusBar.textContent = '';
        if (typeof customAlert === 'function') customAlert('执行失败: ' + e.message);
      }
    });

    // ====== SHA256 计算 ======
    async function sha256(buffer) {
      var hash = await crypto.subtle.digest('SHA-256', buffer);
      var hex = '';
      var bytes = new Uint8Array(hash);
      for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
      return hex;
    }

    // ====== 本地 .so 上传 ======
    var localSoFile = null;
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.so,.so.*';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    document.getElementById('btn-local').addEventListener('click', function() { fileInput.click(); });

    fileInput.addEventListener('change', async function(e) {
      var file = e.target.files[0];
      if (!file) return;
      document.getElementById('local-file-name').textContent = '📄 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
      document.getElementById('local-sha256').textContent = 'SHA256: 计算中...';
      document.getElementById('btn-run-local').disabled = true;
      try {
        var buf = await file.arrayBuffer();
        var hash = await sha256(buf);
        localSoFile = file;
        document.getElementById('local-sha256').textContent = 'SHA256: ' + hash;
        document.getElementById('btn-run-local').disabled = false;
        statusBar.textContent = '本地文件已就绪: ' + file.name;
      } catch (err) {
        document.getElementById('local-sha256').textContent = 'SHA256: ❌ 计算失败';
        if (typeof customAlert === 'function') customAlert('文件读取失败: ' + err.message);
      }
    });

    document.getElementById('btn-run-local').addEventListener('click', async function() {
      if (!localSoFile) {
        if (typeof customAlert === 'function') customAlert('请先选择本地的 .so 文件');
        return;
      }
      if (!window.uploadSoAndRun) {
        if (typeof customAlert === 'function') customAlert('JIT Exploit 尚未完成，请等待');
        return;
      }
      var btn = document.getElementById('btn-run-local');
      btn.disabled = true;
      btn.textContent = '执行中...';
      statusBar.textContent = '正在使用本地 .so 提权...';
      await window.uploadSoAndRun(localSoFile);
      btn.textContent = '✅ 执行完成';
      statusBar.textContent = '本地 .so 提权流程结束，查看终端输出';
    });

    // ====== 启动 ======
    loadManifest();
  </script>
</body>
</html>
